  about:
    enable: true
    title: "About Me"
    image: "/images/about.jpg"
    content: |-
      I'm a Computer & Electrical Engineering dual major at UNLV with a deep interest in how hardware actually works — not just in simulation, but on real silicon. I've designed and deployed custom processors on FPGA, built FSM-based control units from the ground up, and written SystemVerilog that runs on physical hardware at 50 MHz.

      Outside of circuits and code, I've spent 6+ years doing residential construction with my family — electrical wiring, hardwood floors, full bathroom renovations. That background has given me a problem-solving instinct and attention to detail that I bring into every engineering project.

      When I'm not in the lab or on a job site, I'm snowboarding, at the gym, or hanging out with my Australian Shepherd, Luna. I'm a native Spanish speaker and fluent in English.

      **Currently seeking:** Summer 2026 internships in hardware design, embedded systems, or electrical engineering.
    skills:
      enable: true
      title: "Technical Skills:"
      items:
        - "HDL: SystemVerilog, Verilog"
        - "Processor Architecture: Custom ISA, ARM, MIPS, Multicycle & Single-Cycle"
        - "FPGA: Altera DE2-115, Quartus II, TimeQuest Timing Analyzer"
        - "Simulation: ModelSim, waveform analysis, testbench design"
        - "Programming: C++, data structures, algorithms"
        - "Electrical: NEC-compliant wiring, circuit analysis, load calculations"
        - "Languages: Spanish (Native), English (Fluent)"

