  # projects
  projects:
    enable: true
    items:
      - title: Custom 8-Bit Multicycle Processor
        content: Designed complete processor from scratch with 16-instruction ISA, FSM-based control unit, and matrix computation capabilities. Implemented on DE2-115 FPGA.
        image: /images/projects/processor.jpg
        featured:
          name: View Details
          link: /blogs/custom-processor
        badges:
          - "SystemVerilog"
          - "FPGA"
          - "FSM Design"
          - "ISA Design"
        links:
          - icon: fab fa-github
            url: https://github.com/Will-L10

      - title: ARM Processor Implementation
        content: Extended ARM processor with custom EOR and LDRB instructions. Comprehensive datapath and control unit implementation with ModelSim verification.
        image: /images/projects/arm.jpg
        featured:
          name: View Details
          link: /blogs/arm-processor
        badges:
          - "ARM Architecture"
          - "Verilog"
          - "FPGA"
          - "Digital Design"
        links:
          - icon: fab fa-github
            url: https://github.com/Will-L10

      - title: MIPS Processor with Extended ISA
        content: Single-cycle MIPS processor supporting JAL/JR instructions for subroutine calls. Includes complete register file and ALU implementation.
        image: /images/projects/mips.jpg
        featured:
          name: View Details
          link: /blogs/mips-processor
        badges:
          - "MIPS"
          - "SystemVerilog"
          - "Assembly"
          - "FPGA"
        links:
          - icon: fab fa-github
            url: https://github.com/Will-L10

      - title: GCD Algorithm Hardware Implementation
        content: Hardware-based Greatest Common Divisor calculator using Euclidean algorithm and FSM design. Optimized for minimal resource utilization.
        image: /images/projects/gcd.jpg
        featured:
          name: View Details
          link: /blogs/gcd-algorithm
        badges:
          - "Verilog"
          - "FSM"
          - "Algorithm Design"
        links:
          - icon: fab fa-github
            url: https://github.com/Will-L10

      - title: Construction & Renovation Portfolio
        content: 6+ years of hands-on experience in residential construction, electrical installation, hardwood flooring, and complete home renovations.
        image: /images/projects/construction1.jpg
        featured:
          name: View Portfolio
          link: /blogs/construction-portfolio
        badges:
          - "Electrical"
          - "Construction"
          - "Project Management"

