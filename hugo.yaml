    enable: true
    title: "About Me"
    image: "/images/me.png"
    content: |-
      I'm a Computer & Electrical Engineering dual major at UNLV with a passion for digital systems design and processor architecture. My experience spans from designing custom 8-bit processors to implementing ARM and MIPS architectures on FPGAs.

      Beyond academics, I bring 6+ years of hands-on construction experience, including residential electrical installation and renovation work, which has honed my problem-solving abilities and attention to detail.
    skills:
      enable: true
      title: "Here are a few technologies I've been working with:"
