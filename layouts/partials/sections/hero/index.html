{{ with .Site.Params.hero }}
<section id="hero" class="wl-hero">
    <div class="container wl-wrap">
        <div class="wl-hero-grid">
            <div class="wl-hero-text">
                <h1 class="wl-name">{{ .title }}</h1>
                <p class="wl-role">{{ .subtitle }}</p>
                <p class="wl-lede">{{ .content | markdownify }}</p>
                <div class="wl-actions">
                    {{ if .button.enable }}<a class="wl-btn wl-btn-primary" href="{{ .button.url }}" {{ if .button.download }}download{{ end }}>{{ .button.name }}</a>{{ end }}
                    {{ if .button2.enable }}<a class="wl-btn" href="{{ .button2.url }}" {{ if .button2.download }}download{{ end }}>{{ .button2.name }}</a>{{ end }}
                    {{ range .socialLinks.fontAwesomeIcons }}
                    <a class="wl-icon" href="{{ .url }}" target="_blank" rel="noopener" aria-label="{{ if in .icon "github" }}GitHub{{ else if in .icon "linkedin" }}LinkedIn{{ else }}Link{{ end }}"><i class="{{ .icon }}"></i></a>
                    {{ end }}
                </div>
            </div>
            <div class="wl-hero-photo">
                <img src="{{ .image }}" alt="Photo of William Lazcano" width="320" height="320">
            </div>
        </div>
    </div>
</section>
{{ end }}
